version: '3'

services:

  mysql_db:

    image: mysql:5.7

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Kuala_Lumpur

    ports:
      - "3306:3306"

    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - project_network

  python_server:

    build: ./python_server

    container_name: python_server

    depends_on:
      - mysql_db

    ports:
      - "5000:5000"

    networks:
      - project_network

  python_client:

    build: ./python_client

    container_name: python_client

    depends_on:
      - python_server

    networks:
      - project_network

  c_server:

    build: ./c_server

    container_name: c_server

    ports:
      - "6000:6000"

    networks:
      - project_network

  c_client:

    build: ./c_client

    container_name: c_client

    depends_on:
      - c_server

    networks:
      - project_network

networks:
  project_network: